name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Distribution (www)
        run: |
          mkdir -p www
          cp index.html style.css mobile.css app.js app-data.js portfolio-core.js cloud-store.js manifest.json sw.js www/
          cp -r assets www/

      - name: Install Dependencies
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --save

      - name: Setup Capacitor Configuration
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.snoopy.portfoliwolf",
            "appName": "Portfoli Wolf",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Assets
        run: |
          npx cap sync android

      - name: Set Android App Launcher Icons & Permissions
        run: |
          # Remove adaptive XML folder to prevent AAPT2 resource collision
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp www/assets/app-logo.png "$dir/ic_launcher.png" || true
              cp www/assets/app-logo.png "$dir/ic_launcher_round.png" || true
              cp www/assets/app-logo.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

      - name: Grant Executable Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/PortfoliWolf.apk

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortfoliWolf-Android-APK
          path: release-output/PortfoliWolf.apk
          retention-days: 30

